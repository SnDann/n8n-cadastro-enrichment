version: '3.8'

services:
  # ── n8n ────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-portfolio
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Variáveis de ambiente para o fluxo
      - API_KEY_INTERNA=dev-key-local-123
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/COLOQUE_SEU_WEBHOOK_AQUI}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./fluxo:/home/node/.n8n/workflows:ro  # monta os workflows
    networks:
      - portfolio-net
    depends_on:
      - api-clientes

  # ── API Interna Node.js ─────────────────────────────────────
  api-clientes:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-clientes-portfolio
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - API_KEY_INTERNA=dev-key-local-123
      - NODE_ENV=development
    volumes:
      - api_data:/app/data
    networks:
      - portfolio-net

volumes:
  n8n_data:
  api_data:

networks:
  portfolio-net:
    driver: bridge

